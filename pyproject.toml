[project]
name = "image-compression-project"
version = "0.2.0"
description = "A JPEG-style DCT compressor for grayscale images, with rate-distortion optimized quantization."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
icj = "compression:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.setuptools]
py-modules = ["compression"]
